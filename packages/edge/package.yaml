package: edge
version: 0.2.0
label: IoT Edge
description: Device definitions, edge rules and flows, alarms, exports and releases
depends: [ops]
field_prefix: edge_

modules:
  - name: edge
    label: IoT Edge
    icon: factory
    order: 61
    items: [DeviceDefinition, EdgeRule, EdgeFlow, EdgeAlarm, EdgeNotifyRule, EdgeExport, EdgeRelease, EdgeDashboard, EdgeAsset, EdgeFirmware, EdgeRollout, EdgeSchedule]

overlays:
  - entity: Device
    ops:
      - {op: add_field, column: true, field: {name: edge_definition, type: link, to: DeviceDefinition, label: Definition, description: "How it is reached and read. Its gateway picks this up by itself"}}
      - {op: add_field, column: true, field: {name: edge_connect, type: data, label: Address, description: "Where this one is, when the definition does not say: tcp://10.0.0.7:9100"}}
      - {op: add_field, column: true, field: {name: edge_settings, type: json, label: Settings, description: "What {settings.name} stands for in its definition"}}
      - {op: add_field, column: true, field: {name: edge_concurrency, type: int, min: "1", default: 1, label: Commands at Once}}
      - {op: add_field, column: true, field: {name: edge_token_hash, type: data, read_only: true, no_copy: true, hidden: true}}
      - {op: add_field, column: true, field: {name: edge_client_id, type: data, read_only: true, no_copy: true, label: MQTT Client Id}}
      - {op: add_field, column: true, field: {name: edge_username, type: data, read_only: true, no_copy: true, label: MQTT User}}
      - {op: add_field, column: true, field: {name: edge_password_hash, type: data, read_only: true, no_copy: true, hidden: true}}
      - {op: add_field, column: true, field: {name: edge_certificate, type: data, read_only: true, no_copy: true, label: Certificate Fingerprint}}
      - {op: add_field, column: true, field: {name: edge_via, type: link, to: Device, label: Reached Through, description: "A gateway of its own, for a device that sits behind one"}}
      - {op: add_field, column: true, field: {name: edge_tags, type: data, label: Tags, in_list: true, description: "Comma separated: what lets many devices be found and asked at once"}}
      - {op: add_field, column: true, field: {name: edge_asset, type: link, to: EdgeAsset, label: Belongs To, description: "Where it sits among the things that matter here"}}

roles:
  - name: Edge Viewer
    description: Sees gateways, devices, alarms and robots.
    permissions:
      - {entity: DeviceDefinition, read: true}
      - {entity: EdgeRule, read: true}
      - {entity: EdgeFlow, read: true}
      - {entity: EdgeAlarm, read: true}
      - {entity: EdgeExport, read: true}
      - {entity: EdgeRelease, read: true}
      - {entity: EdgeDashboard, read: true}
      - {entity: EdgeNotifyRule, read: true}
      - {entity: EdgeAsset, read: true}
      - {entity: EdgeFirmware, read: true}
      - {entity: EdgeRollout, read: true}
      - {entity: EdgeSchedule, read: true}
      - {entity: Device, read: true}
      - {entity: Site, read: true}
  - name: Edge Engineer
    description: Writes and publishes definitions, rules and exports, and acknowledges alarms.
    permissions:
      - {entity: DeviceDefinition, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EdgeRule, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EdgeFlow, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EdgeAlarm, read: true, export: true}
      - {entity: EdgeExport, read: true, write: true, create: true, delete: true}
      - {entity: EdgeRelease, read: true, write: true, create: true}
      - {entity: EdgeDashboard, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EdgeNotifyRule, read: true, write: true, create: true, delete: true}
      - {entity: EdgeAsset, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: EdgeFirmware, read: true, write: true, create: true, delete: true}
      - {entity: EdgeRollout, read: true, write: true, create: true, delete: true}
      - {entity: EdgeSchedule, read: true, write: true, create: true, delete: true}
      - {entity: Device, read: true, write: true, create: true, export: true, import: true}
      - {entity: DeviceProfile, read: true}
      - {entity: Site, read: true}
      - {entity: SiteArea, read: true}
      - {entity: Company, read: true}
  - name: Edge Reviewer
    description: Reviews flows drawn by others, and decides when they run.
    permissions:
      - {entity: EdgeFlow, read: true, write: true}
      - {entity: DeviceDefinition, read: true}
      - {entity: EdgeRule, read: true}
      - {entity: EdgeAlarm, read: true}
      - {entity: EdgeExport, read: true}
      - {entity: EdgeDashboard, read: true}
      - {entity: Device, read: true}
      - {entity: Site, read: true}
