name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # The places an export can send, the real ones wherever one fits in a container.
      nats:
        image: nats:2
        ports: ["4222:4222"]
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672", "15672:15672"]
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
      influxdb:
        image: influxdb:2
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: ferrum
          DOCKER_INFLUXDB_INIT_PASSWORD: ferrum-test-password
          DOCKER_INFLUXDB_INIT_ORG: ferrum
          DOCKER_INFLUXDB_INIT_BUCKET: readings
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ferrum-test-token
        ports: ["8086:8086"]
      clickhouse:
        image: clickhouse/clickhouse-server:24
        env:
          CLICKHOUSE_PASSWORD: test
        ports: ["8123:8123"]
      moto:
        image: motoserver/moto:5.1.0
        ports: ["5000:5000"]
    env:
      CARGO_TERM_COLOR: always
      FERRUM_TEST_NATS: localhost:4222
      FERRUM_TEST_AMQP: localhost:5672
      FERRUM_TEST_AMQP_MANAGER: http://localhost:15672
      FERRUM_TEST_KAFKA: localhost:9092
      FERRUM_TEST_INFLUX: http://localhost:8086
      FERRUM_TEST_CLICKHOUSE: http://localhost:8123
      FERRUM_TEST_AWS: http://localhost:5000
      FERRUM_TEST_PYTHON: /tmp/clients/bin/python
    steps:
      - uses: actions/checkout@v4
      # Ferrum's Rust, because its server compiles this app. Bump the two together.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The application role must not be a superuser: superusers bypass row-level security.
      - name: Create the application role and test databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role ferrum login password 'ferrum';
          create database ferrum_edge_test owner ferrum;
          create database ferrum_site_test owner ferrum;
          SQL
      - name: Other people's libraries, to meet ours
        run: python3 -m venv /tmp/clients && /tmp/clients/bin/pip install --quiet ocpp==2.1.0 websockets
      - name: Wait for the brokers
        run: |
          for port in 4222 5672 15672 9092 8086 8123 5000; do
            timeout 120 bash -c "until (exec 3<>/dev/tcp/localhost/$port) 2>/dev/null; do sleep 1; done"
          done
      # The lock says what a gateway is built from. This has to keep working with Ferrum's main.
      - run: cargo update -p ferrum-kernel
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The gateway killed at each named point. Failpoints never reach a release build.
      - run: cargo test -p ferrum-site --features failpoints --test recovery_it

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec advisories
        run: cargo install cargo-audit --locked && cargo audit
      - name: Accepted advisories have an owner and a review date
        run: python3 -m pip install --quiet pyyaml && python3 scripts/advisories.py
      - name: Licenses of everything compiled in
        run: python3 scripts/licenses.py check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CBFerrum/Ferrum-Frontend
          path: frontend
      - run: mkdir -p ../ferrum && mv frontend ../ferrum/web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: ../ferrum/web
      - run: npm run check
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
