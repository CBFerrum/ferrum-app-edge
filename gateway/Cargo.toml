[package]
name = "ferrum-site"
description = "The site runtime: keeps physical work going next to the equipment when the link to the platform is down. One binary with an embedded journal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "ferrum-site"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrum-site"
path = "src/main.rs"

[features]
default = ["mqtt", "modbus", "ws", "opcua", "kafka"]
mqtt = ["dep:rumqttc"]
modbus = ["dep:tokio-modbus"]
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
opcua = ["dep:async-opcua"]
kafka = ["dep:rskafka"]
# Deliberate crashes at named points, for the recovery tests. Never in a release.
failpoints = []

[dependencies]
ferrum-ops-contract = { workspace = true }
ferrum-edge-contract = { workspace = true }
aes = "0.8"
async-opcua = { version = "0.19", optional = true, default-features = false, features = ["client", "server"] }
async-trait = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { workspace = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }
hex = { workspace = true }
webrtc-dtls = "0.12"
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }
hmac = "0.12"
libc = "0.2"
rand = "0.9"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rumqttc = { version = "0.25", optional = true, default-features = false, features = ["use-rustls"] }
rskafka = { version = "0.6", optional = true, default-features = false, features = ["transport-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "io-util"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-modbus = { version = "0.17", optional = true, default-features = false, features = ["tcp", "rtu"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { workspace = true }
webpki-roots = "1"

# musl's allocator takes one lock, and every reading allocates.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rumqttd = { version = "0.20", default-features = false }
async-opcua = { version = "0.19", default-features = false, features = ["client", "server"] }
ferrum-app-edge = { path = ".." }
ferrum-domain = { workspace = true }
ferrum-kernel = { workspace = true }
ferrum-meta = { workspace = true }
ferrum-ops = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true

# It kills the real binary at named points, which only a build with `failpoints` can do.
[[test]]
name = "recovery_it"
required-features = ["failpoints"]

[[test]]
name = "charger_it"
required-features = ["failpoints"]
