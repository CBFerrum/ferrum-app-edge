id: edge
name: IoT Edge
version: 0.4.6
publisher: cbferrum
summary: Devices described instead of programmed, flows drawn and reviewed, gateways that keep working offline, alarms and robots
description: README.md
categories: [manufacturing]
license: AGPL-3.0-or-later
homepage: https://github.com/CBFerrum/ferrum-app-edge
support: https://github.com/CBFerrum/ferrum-app-edge/issues
runtime: native
platform: ">=0.3, <0.4"
requires: {ops: ">=0.1"}
packages: [edge]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - {id: edge, route: edge, title: IoT Edge, description: "Devices, gateways, alarms and robots", icon: factory, color: "#0369a1", roles: [Edge Engineer, Edge Reviewer, Edge Viewer]}
  shell.open:
    - {id: edge, package: edge, path: "edge/e/{entity}/{id}", list: "edge/e/{entity}"}
  shell.public:
    - {id: shared, path: edge/shared, title: Dashboard}
  # The workspace's portal: a customer's own devices at /portal/devices/, where /open of one takes them.
  shell.notification:
    - {id: alarm, label: Alarms raised and cleared, default: [inapp, push]}
  shell.portal:
    - {id: devices, title: Your devices, description: "How your devices are doing, their alarms and your dashboards", entity: Device, open: "d/{id}"}
  shell.create:
    - {id: definition, label: Device definition, path: edge/definitions, entity: DeviceDefinition}
    - {id: flow, label: Flow, path: edge/flows, entity: EdgeFlow}
    - {id: dashboard, label: Dashboard, path: edge/dashboards, entity: EdgeDashboard}
