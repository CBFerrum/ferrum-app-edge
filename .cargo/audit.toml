# Advisories reviewed and accepted. Each has its owner, reasoning and review date in
# docs/advisories.yaml, which CI checks against this list. Re-check when dependencies change.
[advisories]
ignore = [
  # rsa comes with the platform's crates through jsonwebtoken, and in the gateway through async-opcua,
  # where a secure channel does use an RSA private key. crypto-bigint comes with the platform's crates
  # alone. docs/advisories.yaml says why these stand.
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0387",
  # rustls-webpki 0.102 arrives through rumqttc, which uses only its error type. Certificates are
  # checked by rustls, through the current rustls-webpki.
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0382",
]
