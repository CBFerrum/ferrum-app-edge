# about: LoRaWAN devices through Actility ThingPark's application server tunnel, decoding the payload here.
# group: Generic
# The fields are examples. Change them to what the device sends.
name: thingpark-webhook
connect: webhook://0.0.0.0:8088?token={secret.webhook_token}
read:
  - {topic: /thingpark, device: "{json.DevEUI_uplink.DevEUI}", bytes: $.DevEUI_uplink.payload_hex, values: [{metric: temp.c, at: 0, type: i16, scale: 0.01, unit: C}]}
  - {topic: /thingpark, device: "{json.DevEUI_uplink.DevEUI}", attribute: rssi, json: $.DevEUI_uplink.LrrRSSI}
