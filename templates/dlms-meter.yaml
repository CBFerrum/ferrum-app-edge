# about: A smart electricity meter over DLMS/COSEM, through its wrapper port, by OBIS code. It only reads.
# group: Energy
name: dlms-meter
connect: dlms://meter:4059?client=16&server=1
tags:
  - {node: 1.0.1.8.0.255, every: 60s, metric: energy.kwh, unit: kWh}
  - {node: 1.0.32.7.0.255, every: 60s, metric: voltage.v, unit: V}
  - {node: 1.0.31.7.0.255, every: 60s, metric: current.a, unit: A}
  - {node: 1.0.1.7.0.255, every: 60s, metric: power.w, unit: W}
